name: Publish verified release files
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ruishwei/Lens-Translate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch audited prebuilt files and verify every SHA256
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          MANIFEST="docs/releases/$TAG-assets.json"
          BUNDLE=$(node -e 'const m=require("./"+process.argv[1]); if(!/^[0-9a-f]{40}$/.test(m.bundleCommit)||m.tag!==process.env.TAG)process.exit(1); console.log(m.bundleCommit)' "$MANIFEST")
          git fetch --no-tags --depth=1 origin "$BUNDLE"
          mkdir "$RUNNER_TEMP/release-bundle"
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/release-bundle"
          node scripts/assemble-release.mjs "$MANIFEST" "$RUNNER_TEMP/release-bundle" "$RUNNER_TEMP/release-assets"
      - name: Upload files before making the release visible
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" "$RUNNER_TEMP/release-assets/"* --verify-tag --draft --prerelease --title "译镜 $TAG · Android 双版本 / Windows 0.1.0" --notes-file "docs/releases/$TAG.md"
          gh release edit "$TAG" --draft=false
